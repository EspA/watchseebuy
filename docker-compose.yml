services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waitseebuy
      POSTGRES_PASSWORD: waitseebuy
      POSTGRES_DB: waitseebuy
    ports:
      - "5432:5432"
    volumes:
      - waitseebuy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waitseebuy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  waitseebuy_pg:
